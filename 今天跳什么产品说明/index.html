<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f4fda">
  <title>练舞记录</title>
  <style>
    :root {
      color-scheme: light;
      --cobalt: #2f4fda;
      --cobalt-deep: #1834b8;
      --red: #ed2f27;
      --red-deep: #c51e1d;
      --ice: #fffaf0;
      --fog: #f6eedf;
      --silver: #e5d9c7;
      --line: rgba(28, 35, 75, 0.15);
      --graphite: #1d2030;
      --muted: #777168;
      --accent: var(--red);
      --accent-deep: var(--red-deep);
      --accent-soft: #f9ddd2;
      --sage: #89937a;
      --surface: rgba(255, 250, 240, 0.88);
      --shadow: 0 22px 60px rgba(25, 31, 73, 0.16);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: #ded5c8;
      color: var(--graphite);
      font-family: Inter, Geist, "Helvetica Neue", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button, input, textarea, select { font: inherit; }
    button { color: inherit; }

    .app {
      position: relative;
      width: min(100%, 430px);
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--ice);
      box-shadow: var(--shadow);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: max(12px, env(safe-area-inset-top)) 22px 10px;
      background: rgba(47, 79, 218, 0.92);
      border-bottom: 1px solid rgba(255,250,240,0.18);
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
    }

    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--ice);
      text-transform: uppercase;
    }

    .top-date {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: rgba(255,250,240,0.74);
    }

    main { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }

    .app-page[hidden] { display: none; }

    .intro {
      position: relative;
      padding: 42px 22px 30px;
      overflow: hidden;
      background: var(--cobalt);
      border-bottom: 6px solid var(--red);
    }

    .eyebrow {
      margin: 0 0 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: rgba(255,250,240,0.72);
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 280px;
      color: var(--ice);
      font-size: 48px;
      font-weight: 760;
      line-height: 0.98;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
      padding: 20px 0 18px;
      border-top: 1px solid rgba(255,250,240,0.26);
      border-bottom: 1px solid rgba(255,250,240,0.26);
    }

    .summary-item + .summary-item { border-left: 1px solid rgba(255,250,240,0.26); padding-left: 20px; }

    .summary-label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      color: rgba(255,250,240,0.72);
    }

    .summary-value {
      display: block;
      color: var(--ice);
      font-size: 38px;
      font-weight: 720;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .summary-meta {
      display: block;
      margin-top: 7px;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--ice);
      text-transform: uppercase;
    }

    .primary-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 56px;
      margin-top: 20px;
      padding: 0 17px;
      border: 1px solid rgba(255,250,240,0.25);
      border-radius: 7px;
      background: var(--red);
      color: var(--ice);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(147, 20, 24, 0.22);
    }

    .primary-action strong { font-size: 15px; font-weight: 550; }

    .plus-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 50%;
      font-size: 20px;
      font-weight: 300;
      line-height: 1;
    }

    .library { padding: 28px 22px 0; background: var(--ice); }

    .library-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .library-head h2 { margin: 0; color: var(--cobalt-deep); font-size: 21px; font-weight: 720; }

    .view-switch {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      border: 1px solid rgba(47,79,218,0.22);
      border-radius: 7px;
      background: rgba(47,79,218,0.06);
    }

    .view-switch button {
      min-width: 55px;
      min-height: 29px;
      padding: 0 10px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .view-switch button[aria-selected="true"] {
      background: var(--red);
      color: var(--ice);
      box-shadow: none;
    }

    .record-nav {
      display: flex;
      gap: 20px;
      margin: 0 0 22px;
      overflow-x: auto;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }

    .record-nav::-webkit-scrollbar { display: none; }

    .record-nav button {
      position: relative;
      min-height: 44px;
      flex: 0 0 auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }

    .record-nav button[aria-current="true"] {
      color: var(--cobalt-deep);
      font-weight: 700;
    }

    .record-nav button[aria-current="true"]::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: var(--red);
    }

    .day-group, .goal-group { margin-bottom: 28px; }

    .group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 0 2px 9px;
      border-bottom: 1px solid var(--line);
    }

    .group-title { color: var(--cobalt-deep); font-size: 12px; font-weight: 720; }
    .group-total { font-size: 10px; color: var(--red-deep); letter-spacing: 0.08em; text-transform: uppercase; }

    .track {
      position: relative;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      width: 100%;
      min-height: 84px;
      padding: 15px 2px;
      border: 0;
      border-bottom: 1px solid rgba(91,78,61,0.10);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .track:active { background: rgba(255,255,255,0.38); }

    .duration {
      color: var(--red);
      font-size: 27px;
      font-weight: 720;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .duration small {
      display: block;
      margin-top: 7px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--cobalt-deep);
    }

    .track-copy { min-width: 0; }

    .track-title {
      display: block;
      overflow: hidden;
      margin-bottom: 5px;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-meta {
      display: block;
      overflow: hidden;
      color: #6d6a68;
      font-size: 11px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-index {
      align-self: start;
      min-width: 22px;
      padding-top: 2px;
      color: var(--red-deep);
      font-size: 10px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .goal-header {
      padding: 16px 0 12px;
      border-top: 3px solid var(--cobalt);
    }

    .goal-kicker {
      margin-bottom: 6px;
      color: var(--red-deep);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .goal-title { margin: 0; font-size: 16px; font-weight: 560; line-height: 1.45; }

    .goal-summary { margin-top: 7px; color: var(--muted); font-size: 11px; }

    .empty {
      padding: 46px 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      align-items: end;
      justify-items: center;
      padding: 0;
      background: rgba(16, 24, 74, 0.34);
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .overlay.open { opacity: 1; visibility: visible; }

    .sheet {
      width: min(100%, 430px);
      max-height: min(92dvh, 820px);
      overflow: auto;
      overscroll-behavior: contain;
      border: 1px solid rgba(255,250,240,0.72);
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      background: rgba(255,250,240,0.97);
      box-shadow: 0 -20px 60px rgba(17,25,76,0.22);
      backdrop-filter: blur(14px) saturate(115%);
      -webkit-backdrop-filter: blur(14px) saturate(115%);
      transform: translateY(28px);
      transition: transform 220ms ease;
    }

    .overlay.open .sheet { transform: translateY(0); }

    .sheet-handle { width: 36px; height: 4px; margin: 9px auto 3px; border-radius: 2px; background: rgba(47,79,218,0.30); }

    .sheet-top {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 20px;
      background: rgba(255,250,240,0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .sheet-top h2 { margin: 0; color: var(--cobalt-deep); font-size: 20px; font-weight: 720; }

    .icon-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border: 1px solid rgba(47,79,218,0.22);
      border-radius: 50%;
      background: rgba(255,250,240,0.78);
      font-size: 21px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
    }

    .sheet-body { padding: 22px 20px calc(28px + env(safe-area-inset-bottom)); }

    .field { margin-bottom: 24px; }

    .field-label {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
      color: var(--cobalt-deep);
      font-size: 12px;
      font-weight: 720;
    }

    .optional { color: var(--red-deep); font-size: 10px; font-weight: 500; }

    input, textarea, select {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid rgba(47,79,218,0.18);
      border-radius: 6px;
      outline: none;
      background: rgba(255,255,252,0.82);
      color: var(--graphite);
    }

    textarea { min-height: 82px; resize: vertical; line-height: 1.55; }
    input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { margin: 0; -webkit-appearance: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px rgba(47,79,218,0.12); }

    .choice-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    .choice {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(47,79,218,0.17);
      border-radius: 6px;
      background: rgba(255,255,252,0.66);
      color: #55576a;
      font-size: 12px;
      cursor: pointer;
    }

    .choice.selected {
      border-color: var(--cobalt);
      background: var(--cobalt);
      color: var(--ice);
    }

    .duration-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .duration-grid .choice { padding: 0 4px; font-variant-numeric: tabular-nums; }

    .suggestions { display: flex; gap: 7px; overflow-x: auto; margin-top: 9px; padding-bottom: 3px; scrollbar-width: none; }
    .suggestions::-webkit-scrollbar { display: none; }

    .suggestion {
      flex: 0 0 auto;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(47,79,218,0.16);
      border-radius: 5px;
      background: transparent;
      color: var(--cobalt-deep);
      font-size: 11px;
      cursor: pointer;
    }

    .custom-row { display: grid; grid-template-columns: 1fr 54px; gap: 9px; margin-top: 9px; }
    .custom-row input { min-width: 0; }
    .unit-box { display: grid; place-items: center; border: 1px solid rgba(47,79,218,0.14); border-radius: 6px; color: var(--red-deep); font-size: 11px; }

    .custom-entry { display: none; margin-top: 9px; }
    .custom-entry.open { display: block; }

    .save-button, .edit-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 7px;
      background: var(--red);
      color: var(--ice);
      font-weight: 680;
      cursor: pointer;
    }

    .detail-hero { margin: -6px -20px 22px; padding: 30px 20px 28px; text-align: center; border-bottom: 5px solid var(--red); background: var(--cobalt); color: var(--ice); }
    .detail-date { margin-bottom: 18px; color: rgba(255,250,240,0.74); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
    .detail-time { color: var(--ice); font-size: 64px; font-weight: 760; line-height: 0.92; font-variant-numeric: tabular-nums; }
    .detail-time span { margin-left: 5px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: var(--ice); }
    .detail-title { margin: 20px 0 6px; font-size: 21px; font-weight: 680; }
    .detail-style { color: rgba(255,250,240,0.72); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

    .detail-list { margin: 0 0 24px; }
    .detail-row { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .detail-row dt { color: var(--red-deep); font-size: 11px; font-weight: 650; }
    .detail-row dd { margin: 0; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }

    .toast {
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      padding: 10px 15px;
      border-radius: 6px;
      background: rgba(24,52,184,0.96);
      color: #fff;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: 180ms ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .goal-overview {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-top: 28px;
      padding: 20px 0 18px;
      border-top: 1px solid rgba(255,250,240,0.26);
      border-bottom: 1px solid rgba(255,250,240,0.26);
    }

    .goal-count {
      color: var(--ice);
      font-size: 38px;
      font-weight: 720;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .goal-count small {
      display: block;
      margin-top: 8px;
      color: rgba(255,250,240,0.72);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .goal-overview-note { max-width: 150px; color: rgba(255,250,240,0.72); font-size: 11px; line-height: 1.55; text-align: right; }

    .goal-row {
      display: block;
      width: 100%;
      padding: 19px 2px 18px;
      border: 0;
      border-top: 2px solid var(--cobalt);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .goal-row + .goal-row { margin-top: 8px; }
    .goal-row:active { background: rgba(47,79,218,0.05); }

    .goal-row-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
    .goal-row-title { display: block; margin: 0; font-size: 17px; font-weight: 680; line-height: 1.4; }
    .goal-row-range { display: block; margin-top: 8px; color: var(--cobalt-deep); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .goal-row-meta { display: block; margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .goal-row-stats { display: block; margin-top: 14px; color: var(--red-deep); font-size: 11px; font-weight: 650; letter-spacing: 0.04em; }

    .status-label {
      flex: 0 0 auto;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .status-label.active { border-color: rgba(47,79,218,0.28); color: var(--cobalt-deep); }
    .status-label.completed { border-color: rgba(197,30,29,0.24); color: var(--red-deep); }

    .form-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .goal-detail-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin: 0 0 22px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .goal-detail-stat { padding: 17px 0; }
    .goal-detail-stat + .goal-detail-stat { padding-left: 18px; border-left: 1px solid var(--line); }
    .goal-detail-stat strong { display: block; color: var(--cobalt-deep); font-size: 27px; font-weight: 720; }
    .goal-detail-stat span { display: block; margin-top: 6px; color: var(--muted); font-size: 10px; text-transform: uppercase; }

    .section-label { margin: 26px 0 8px; color: var(--cobalt-deep); font-size: 11px; font-weight: 720; letter-spacing: 0.08em; text-transform: uppercase; }

    .goal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 24px; }
    .goal-actions .edit-button { grid-column: 1 / -1; }

    .secondary-button {
      min-height: 46px;
      border: 1px solid rgba(47,79,218,0.24);
      border-radius: 7px;
      background: rgba(255,255,252,0.62);
      color: var(--cobalt-deep);
      font-weight: 620;
      cursor: pointer;
    }

    .main-nav {
      position: fixed;
      z-index: 30;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: min(100%, 430px);
      min-height: calc(62px + env(safe-area-inset-bottom));
      margin: 0 auto;
      padding: 7px 18px env(safe-area-inset-bottom);
      border-top: 1px solid rgba(47,79,218,0.15);
      background: rgba(255,250,240,0.92);
      backdrop-filter: blur(16px) saturate(115%);
      -webkit-backdrop-filter: blur(16px) saturate(115%);
    }

    .main-nav button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .main-nav button[aria-current="page"] { color: var(--cobalt-deep); font-weight: 720; }

    .main-nav button[aria-current="page"]::before {
      content: "";
      display: block;
      width: 18px;
      height: 2px;
      margin: 0 auto 7px;
      background: var(--red);
    }

    .shuffle-page {
      min-height: calc(100dvh - 58px - 92px);
      background: var(--cobalt);
    }

    .shuffle-screen {
      display: flex;
      min-height: calc(100dvh - 58px - 92px);
      flex-direction: column;
      justify-content: center;
      padding: 32px 22px 38px;
      color: var(--ice);
    }

    .shuffle-screen h1 {
      max-width: none;
      margin-bottom: 14px;
      font-size: 46px;
      line-height: 1.02;
    }

    .shuffle-copy { max-width: 280px; margin: 0; color: rgba(255,250,240,0.72); font-size: 13px; line-height: 1.6; }

    .shuffle-control {
      margin-top: 42px;
      padding: 18px 0 20px;
      border-top: 1px solid rgba(255,250,240,0.25);
      border-bottom: 1px solid rgba(255,250,240,0.25);
    }

    .shuffle-label { display: block; margin-bottom: 13px; color: rgba(255,250,240,0.72); font-size: 10px; font-weight: 650; letter-spacing: 0.12em; text-transform: uppercase; }

    .shuffle-duration-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }

    .shuffle-duration {
      min-width: 0;
      min-height: 45px;
      padding: 0 3px;
      border: 1px solid rgba(255,250,240,0.25);
      border-radius: 6px;
      background: rgba(255,250,240,0.07);
      color: rgba(255,250,240,0.75);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .shuffle-duration[aria-pressed="true"] {
      border-color: var(--ice);
      background: var(--ice);
      color: var(--cobalt-deep);
      font-weight: 720;
    }

    .shuffle-button { margin-top: 24px; }
    .shuffle-note { margin: 14px 2px 0; color: rgba(255,250,240,0.55); font-size: 10px; line-height: 1.5; }

    .overlay.result-mode { align-items: center; padding: 20px; }

    .overlay.result-mode .sheet {
      width: min(100%, 390px);
      max-height: calc(100dvh - 40px);
      border-bottom: 1px solid rgba(255,250,240,0.72);
      border-radius: 8px;
    }

    .result-card { padding: 15px 22px 24px; text-align: center; }
    .result-card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .result-kicker { margin: 0; color: var(--red-deep); font-size: 10px; font-weight: 720; letter-spacing: 0.15em; text-transform: uppercase; }
    .result-time { color: var(--cobalt-deep); font-size: 56px; font-weight: 760; line-height: 0.9; font-variant-numeric: tabular-nums; }
    .result-time span { margin-left: 6px; font-size: 11px; font-weight: 720; letter-spacing: 0.12em; }
    .result-title { max-width: 310px; margin: 24px auto 8px; color: var(--graphite); font-size: 26px; font-weight: 720; line-height: 1.22; overflow-wrap: anywhere; }
    .result-meta { color: var(--cobalt-deep); font-size: 10px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; }
    .result-focus { margin: 14px auto 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .result-reason { margin: 24px 0 0; padding: 18px 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--graphite); font-size: 13px; line-height: 1.65; }
    .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 20px; }
    .result-actions .save-button { grid-column: 1 / -1; }

    @media (max-height: 680px) {
      .shuffle-screen { justify-content: flex-start; padding-top: 24px; padding-bottom: 24px; }
      .shuffle-screen h1 { margin-bottom: 9px; font-size: 39px; }
      .shuffle-control { margin-top: 25px; padding: 14px 0 16px; }
      .shuffle-button { margin-top: 18px; }
      .shuffle-note { margin-top: 10px; }
    }

    @media (min-width: 600px) {
      body { padding: 28px 0; }
      .app { min-height: calc(100dvh - 56px); border: 1px solid rgba(255,255,255,0.75); border-radius: 8px; }
      .overlay { padding-bottom: 28px; }
      .sheet { border-bottom: 1px solid rgba(255,255,255,0.72); border-radius: 8px; }
      .main-nav { bottom: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Dance Archive</div>
      <div class="top-date" id="topDate"></div>
    </header>
    <main>
      <div class="app-page" id="recordPage">
        <section class="intro">
          <p class="eyebrow">Practice Records</p>
          <h1>练舞记录</h1>
          <div class="summary" id="summary"></div>
          <button class="primary-action" id="addRecord" type="button">
            <strong>记一次练舞</strong>
            <span class="plus-mark" aria-hidden="true">+</span>
          </button>
        </section>

        <section class="library">
          <div class="library-head">
            <h2>最近记录</h2>
            <div class="view-switch" role="tablist" aria-label="记录查看方式">
              <button type="button" data-view="date" role="tab" aria-selected="true">日期</button>
              <button type="button" data-view="goal" role="tab" aria-selected="false">阶段</button>
            </div>
          </div>
          <nav class="record-nav" id="recordNav" aria-label="记录分组导航"></nav>
          <div id="recordsView"></div>
        </section>
      </div>

      <div class="app-page" id="goalsPage" hidden>
        <section class="intro">
          <p class="eyebrow">Stage Goals</p>
          <h1>阶段目标</h1>
          <div class="goal-overview" id="goalOverview"></div>
          <button class="primary-action" id="addGoal" type="button">
            <strong>新建阶段</strong>
            <span class="plus-mark" aria-hidden="true">+</span>
          </button>
        </section>
        <section class="library">
          <div class="library-head">
            <h2>我的阶段</h2>
          </div>
          <div id="goalList"></div>
        </section>
      </div>

      <div class="app-page shuffle-page" id="shufflePage" hidden>
        <section class="shuffle-screen">
          <p class="eyebrow">Today’s Pick</p>
          <h1>今天练什么</h1>
          <p class="shuffle-copy">选一个今天能留给舞的时间，给你一个轻一点的方向。</p>
          <div class="shuffle-control">
            <span class="shuffle-label">Available Time</span>
            <div class="shuffle-duration-grid" aria-label="今天可练时长">
              <button class="shuffle-duration" type="button" data-shuffle-minutes="20" aria-pressed="false">20</button>
              <button class="shuffle-duration" type="button" data-shuffle-minutes="30" aria-pressed="true">30</button>
              <button class="shuffle-duration" type="button" data-shuffle-minutes="45" aria-pressed="false">45</button>
              <button class="shuffle-duration" type="button" data-shuffle-minutes="60" aria-pressed="false">60</button>
              <button class="shuffle-duration" type="button" data-shuffle-minutes="90" aria-pressed="false">90+</button>
            </div>
          </div>
          <button class="primary-action shuffle-button" id="drawRecommendation" type="button">
            <strong>今天练什么</strong>
            <span class="plus-mark" aria-hidden="true">↗</span>
          </button>
          <p class="shuffle-note">会参考进行中的阶段、最近练过的内容和今天的时间。</p>
        </section>
      </div>
    </main>
    <nav class="main-nav" aria-label="主页面">
      <button type="button" data-page="record" aria-current="page">记录</button>
      <button type="button" data-page="goals">目标</button>
      <button type="button" data-page="shuffle">抽签</button>
    </nav>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheetContent"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const activityOptions = ["基本功", "体能", "自学成品舞", "上课", "编舞", "Freestyle", "拍摄", "发布作品"];
    const styleOptions = ["Hiphop", "Jazz", "K-pop", "Waacking", "Popping", "House", "Locking", "Choreography", "Breaking", "Voguing", "Krump", "Turfing"];

    const defaultGoals = [
      { id: "g1", start_date: "2026-10-05", end_date: "2026-10-11", duration_days: 7, activity_type: "基本功", dance_style: "Hiphop", focus_concepts: ["脚步", "rock", "bounce"], title: "最近 7 天集中练 Hiphop 脚步", note: "先把换重心和快拍脚步练顺。", metric: null, target_value: null, unit: null, status: "active" },
      { id: "g2", start_date: "2026-09-29", end_date: "2026-10-12", duration_days: 14, activity_type: "基本功", dance_style: "Jazz", focus_concepts: ["中段基本功", "胯部基本功", "手臂协调"], title: "Jazz 中段基本功 clean up", note: "重点放在上肢和胯部的协调。", metric: null, target_value: null, unit: null, status: "active" },
      { id: "g3", start_date: "2026-09-24", end_date: "2026-10-08", duration_days: 15, activity_type: "自学成品舞", dance_style: "K-pop", focus_concepts: ["Whiplash", "副歌", "clean"], title: "K-pop 副歌拍摄版", note: "完整跑顺后录一版。", metric: "works_completed", target_value: 1, unit: "支", status: "active" }
    ];

    const defaultRecords = [
      { id: "r1", date: "2026-10-05", duration_minutes: 45, activity_types: ["基本功"], dance_styles: ["Hiphop"], focus_concepts: ["脚步", "rock", "bounce"], related_goal_ids: ["g1"], note: "重心比上次稳，快拍还是会抢。", created_at: "2026-10-05T20:20:00+08:00" },
      { id: "r2", date: "2026-10-05", duration_minutes: 60, activity_types: ["上课"], dance_styles: ["Jazz"], focus_concepts: ["中段基本功", "胯部基本功", "手臂协调"], related_goal_ids: ["g2"], note: "最后两组的手臂路径再顺一下。", created_at: "2026-10-05T16:10:00+08:00" },
      { id: "r3", date: "2026-10-05", duration_minutes: 30, activity_types: ["自学成品舞"], dance_styles: ["K-pop"], focus_concepts: ["Whiplash", "副歌", "clean"], related_goal_ids: ["g3"], note: "先把副歌左右方向记熟了。", created_at: "2026-10-05T11:40:00+08:00" },
      { id: "r4", date: "2026-10-03", duration_minutes: 40, activity_types: ["编舞", "Freestyle"], dance_styles: ["Jazz", "Choreography"], focus_concepts: ["水系编舞", "找动作素材"], related_goal_ids: [], note: "中间八拍还没定。", created_at: "2026-10-03T22:15:00+08:00" },
      { id: "r5", date: "2026-10-01", duration_minutes: 50, activity_types: ["基本功"], dance_styles: ["Jazz"], focus_concepts: ["胸腰", "上肢控制", "line"], related_goal_ids: ["g2"], note: "", created_at: "2026-10-01T19:30:00+08:00" },
      { id: "r6", date: "2026-09-29", duration_minutes: 35, activity_types: ["基本功", "Freestyle"], dance_styles: ["Waacking"], focus_concepts: ["手臂路径", "freestyle"], related_goal_ids: [], note: "右手反向还不顺。", created_at: "2026-09-29T21:05:00+08:00" },
      { id: "r7", date: "2026-09-27", duration_minutes: 90, activity_types: ["上课", "自学成品舞"], dance_styles: ["Hiphop"], focus_concepts: ["groove", "成品复习"], related_goal_ids: [], note: "课后完整跑了三遍。", created_at: "2026-09-27T18:50:00+08:00" }
    ];

    const storageKeys = { records: "dance-log-records-v2", goals: "dance-log-goals-v2" };

    function loadStored(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : structuredClone(fallback);
      } catch (error) {
        return structuredClone(fallback);
      }
    }

    function normalizeGoal(goal) {
      return {
        id: goal.id,
        start_date: goal.start_date || goal.start || localDateString(),
        end_date: goal.end_date || goal.end || localDateString(),
        duration_days: goal.duration_days || 1,
        activity_type: goal.activity_type || "其他",
        dance_style: goal.dance_style || goal.style || "其他",
        focus_concepts: goal.focus_concepts || [],
        title: goal.title || "未命名阶段",
        note: goal.note || "",
        metric: goal.metric || null,
        target_value: goal.target_value || null,
        unit: goal.unit || null,
        status: goal.status || "active"
      };
    }

    let goals = loadStored(storageKeys.goals, defaultGoals).map(normalizeGoal);
    let records = loadStored(storageKeys.records, defaultRecords);

    function persistData() {
      try {
        localStorage.setItem(storageKeys.records, JSON.stringify(records));
        localStorage.setItem(storageKeys.goals, JSON.stringify(goals));
      } catch (error) {
        showToast("本地保存暂时不可用");
      }
    }

    const state = {
      page: "record", view: "date", editingId: null, editingGoalId: null,
      dateScope: "day", stageScope: "free", shuffleMinutes: 30,
      recommendation: null, lastRecommendationId: null
    };
    const overlay = document.getElementById("overlay");
    const sheetContent = document.getElementById("sheetContent");
    const recordPage = document.getElementById("recordPage");
    const goalsPage = document.getElementById("goalsPage");
    const shufflePage = document.getElementById("shufflePage");
    const goalOverview = document.getElementById("goalOverview");
    const goalList = document.getElementById("goalList");
    const recordNav = document.getElementById("recordNav");
    const recordsView = document.getElementById("recordsView");

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function formatDate(value, includeYear = false) {
      const date = parseDate(value);
      const today = localDateString();
      if (value === today) return "今天";
      return new Intl.DateTimeFormat("zh-CN", { month: "short", day: "numeric", weekday: "short", ...(includeYear ? { year: "numeric" } : {}) }).format(date);
    }

    function formatRange(value) {
      return new Intl.DateTimeFormat("en-US", { month: "short", day: "2-digit" }).format(parseDate(value)).toUpperCase();
    }

    function formatMinutes(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      if (!hours) return `${mins}M`;
      return `${String(hours).padStart(2, "0")}H ${String(mins).padStart(2, "0")}M`;
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
    }

    function recordTitle(record) {
      if (record.focus_concepts.length) return record.focus_concepts.slice(0, 2).join(" · ");
      return record.activity_types.join(" · ") || "练舞记录";
    }

    function totalFor(items) { return items.reduce((sum, item) => sum + item.duration_minutes, 0); }

    function renderSummary() {
      const today = parseDate(localDateString());
      const mondayOffset = (today.getDay() + 6) % 7;
      const weekStart = new Date(today);
      weekStart.setDate(today.getDate() - mondayOffset);
      const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
      const week = records.filter(record => parseDate(record.date) >= weekStart && parseDate(record.date) <= today);
      const month = records.filter(record => parseDate(record.date) >= monthStart && parseDate(record.date) <= today);
      document.getElementById("summary").innerHTML = `
        <div class="summary-item">
          <span class="summary-label">本周累计</span>
          <strong class="summary-value">${String(week.length).padStart(2, "0")}</strong>
          <span class="summary-meta">${formatMinutes(totalFor(week))}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">本月累计</span>
          <strong class="summary-value">${String(month.length).padStart(2, "0")}</strong>
          <span class="summary-meta">${formatMinutes(totalFor(month))}</span>
        </div>`;
    }

    function trackMarkup(record, index) {
      const style = record.dance_styles.join(" + ") || "未填写舞种";
      const activity = record.activity_types.join(" + ") || "自由练习";
      return `
        <button class="track" type="button" data-record-id="${record.id}" aria-label="查看 ${escapeHtml(recordTitle(record))} 的记录详情">
          <span class="duration">${record.duration_minutes}<small>MIN</small></span>
          <span class="track-copy">
            <span class="track-title">${escapeHtml(recordTitle(record))}</span>
            <span class="track-meta">${escapeHtml(style.toUpperCase())} / ${escapeHtml(activity.toUpperCase())}</span>
          </span>
          <span class="track-index">${String(index + 1).padStart(2, "0")}</span>
        </button>`;
    }

    function dateGroupKey(dateValue) {
      const date = parseDate(dateValue);
      if (state.dateScope === "year") return String(date.getFullYear());
      if (state.dateScope === "month") return dateValue.slice(0, 7);
      if (state.dateScope === "week") {
        const monday = new Date(date);
        monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
        return localDateString(monday);
      }
      return dateValue;
    }

    function dateGroupLabel(key) {
      if (state.dateScope === "year") return `${key}年`;
      if (state.dateScope === "month") {
        const [year, month] = key.split("-");
        return `${year}年${Number(month)}月`;
      }
      if (state.dateScope === "week") {
        const monday = parseDate(key);
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        const short = date => `${date.getMonth() + 1}月${date.getDate()}日`;
        return `${short(monday)} — ${short(sunday)}`;
      }
      return formatDate(key);
    }

    function renderRecordNav() {
      if (state.view === "date") {
        const options = [["year", "年"], ["month", "月"], ["week", "周"], ["day", "日"]];
        recordNav.innerHTML = options.map(([value, label]) => `<button type="button" data-date-scope="${value}" aria-current="${state.dateScope === value}">${label}</button>`).join("");
        return;
      }
      const options = [{ id: "free", label: "自由练习" }, ...goals.map(goal => ({ id: goal.id, label: goal.title }))];
      recordNav.innerHTML = options.map(option => `<button type="button" data-stage-scope="${option.id}" aria-current="${state.stageScope === option.id}">${escapeHtml(option.label)}</button>`).join("");
    }

    function renderDateView() {
      const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at));
      const groups = sorted.reduce((all, record) => ((all[dateGroupKey(record.date)] ||= []).push(record), all), {});
      recordsView.innerHTML = Object.entries(groups).map(([key, items]) => `
        <section class="day-group">
          <div class="group-head">
            <span class="group-title">${dateGroupLabel(key)}</span>
            <span class="group-total">${items.length} sessions · ${formatMinutes(totalFor(items))}</span>
          </div>
          ${items.map(trackMarkup).join("")}
        </section>`).join("") || '<div class="empty">还没有练舞记录</div>';
    }

    function renderGoalView() {
      const goal = goals.find(item => item.id === state.stageScope) || null;
      const items = goal
        ? records.filter(record => record.related_goal_ids.includes(goal.id))
        : records.filter(record => !record.related_goal_ids.length);
      recordsView.innerHTML = items.length ? `
        <section class="goal-group">
          <div class="goal-header">
            <div class="goal-kicker">${goal ? `${escapeHtml(goal.dance_style)} · ${formatRange(goal.start_date)} — ${formatRange(goal.end_date)}` : "Free Practice"}</div>
            <h3 class="goal-title">${goal ? escapeHtml(goal.title) : "自由练习"}</h3>
            <div class="goal-summary">${items.length} 次 · ${formatMinutes(totalFor(items))}</div>
          </div>
          ${[...items].sort((a,b) => b.date.localeCompare(a.date)).map(trackMarkup).join("")}
        </section>` : '<div class="empty">这个阶段还没有练舞记录</div>';
    }

    function renderRecords() {
      document.querySelectorAll("[data-view]").forEach(button => button.setAttribute("aria-selected", String(button.dataset.view === state.view)));
      renderRecordNav();
      state.view === "date" ? renderDateView() : renderGoalView();
    }

    function goalRecords(goalId) {
      return records.filter(record => record.related_goal_ids.includes(goalId));
    }

    function goalStatusLabel(status) {
      return ({ active: "进行中", paused: "已暂停", completed: "已完成" })[status] || status;
    }

    function renderGoalsPage() {
      const activeGoals = goals.filter(goal => goal.status === "active");
      goalOverview.innerHTML = `
        <div class="goal-count">${String(activeGoals.length).padStart(2, "0")}<small>Active Stages</small></div>
        <div class="goal-overview-note">按自己的节奏推进，记录会自动汇总到对应阶段。</div>`;
      const order = { active: 0, paused: 1, completed: 2 };
      const sorted = [...goals].sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9) || b.end_date.localeCompare(a.end_date));
      goalList.innerHTML = sorted.map(goal => {
        const linked = goalRecords(goal.id);
        const focus = goal.focus_concepts.join(" · ") || "暂未填写重点";
        return `
          <button class="goal-row" type="button" data-goal-id="${goal.id}" aria-label="查看阶段 ${escapeHtml(goal.title)}">
            <span class="goal-row-head">
              <span>
                <span class="goal-row-title">${escapeHtml(goal.title)}</span>
                <span class="goal-row-range">${formatRange(goal.start_date)} — ${formatRange(goal.end_date)}</span>
              </span>
              <span class="status-label ${goal.status}">${goalStatusLabel(goal.status)}</span>
            </span>
            <span class="goal-row-meta">${escapeHtml(goal.dance_style)} / ${escapeHtml(goal.activity_type)}<br>${escapeHtml(focus)}</span>
            <span class="goal-row-stats">${linked.length} SESSIONS · ${formatMinutes(totalFor(linked))}</span>
          </button>`;
      }).join("") || '<div class="empty">还没有阶段目标</div>';
    }

    function renderPage() {
      recordPage.hidden = state.page !== "record";
      goalsPage.hidden = state.page !== "goals";
      shufflePage.hidden = state.page !== "shuffle";
      document.querySelectorAll("[data-page]").forEach(button => {
        if (button.dataset.page === state.page) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
      if (state.page === "goals") renderGoalsPage();
    }

    function openGoalForm(goal = null) {
      state.editingGoalId = goal?.id || null;
      const draft = goal || {
        title: "", start_date: localDateString(), end_date: localDateString(), activity_type: "基本功",
        dance_style: "Hiphop", focus_concepts: [], note: "", target_value: null, unit: "", status: "active"
      };
      const builtInStyle = styleOptions.includes(draft.dance_style);
      sheetContent.innerHTML = `
        <div class="sheet-top">
          <h2 id="sheetTitle">${goal ? "编辑阶段" : "新建阶段"}</h2>
          <button class="icon-button" type="button" data-close aria-label="关闭">×</button>
        </div>
        <form class="sheet-body" id="goalForm">
          <div class="field">
            <label class="field-label" for="goalTitle">目标描述</label>
            <input id="goalTitle" name="title" type="text" maxlength="80" required placeholder="例如：最近 7 天集中练 Hiphop 脚步" value="${escapeHtml(draft.title)}">
          </div>
          <div class="field">
            <div class="field-label"><span>周期</span><span class="optional">· 开始与结束日期</span></div>
            <div class="form-two-col">
              <input name="start_date" type="date" aria-label="开始日期" value="${draft.start_date}" required>
              <input name="end_date" type="date" aria-label="结束日期" value="${draft.end_date}" required>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="goalActivity">内容类型</label>
            <select id="goalActivity" name="activity_type">
              ${[...activityOptions, "其他"].map(value => `<option value="${value}" ${draft.activity_type === value ? "selected" : ""}>${value}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="goalStyle">舞种</label>
            <select id="goalStyle" name="dance_style">

    function saveGoal(form) {

        showToast("结束日期不能早于开始日期");

      }
      const selectedStyle = form.elements.dance_style.value;
      const customStyle = form.elements.custom_style.value.trim();
      if (selectedStyle === "其他" && !customStyle) {
        showToast("写一下你的舞种");
        form.elements.custom_style.focus();
        return;
      }
      const existing = goals.find(goal => goal.id === state.editingGoalId);
      const startDate = parseDate(start);
      const endDate = parseDate(end);
      const value = {
        id: existing?.id || `g-${Date.now()}`,
        start_date: start,
        end_date: end,
        duration_days: Math.round((endDate - startDate) / 86400000) + 1,
        activity_type: form.elements.activity_type.value,
        dance_style: selectedStyle === "其他" ? customStyle : selectedStyle,
        focus_concepts: splitValues(form.elements.focus_concepts.value),
        title: form.elements.title.value.trim(),
        note: form.elements.note.value.trim(),
        metric: form.elements.target_value.value ? "custom" : null,
        target_value: form.elements.target_value.value ? Number(form.elements.target_value.value) : null,
        unit: form.elements.unit.value.trim() || null,
        status: existing?.status || "active"
      };
      goals = existing ? goals.map(goal => goal.id === existing.id ? value : goal) : [value, ...goals];
      state.stageScope = value.id;
      persistData();
      renderGoalsPage();
      renderRecords();
      closeSheet();
      showToast(existing ? "阶段已更新" : "阶段已创建");

    function recommendationCandidates(minutes) {
      const recent = [...records].sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at)).slice(0, 6);
      const recentThree = recent.slice(0, 3);
      const activeGoals = goals.filter(goal => goal.status === "active");
      const candidates = [];

      activeGoals.forEach(goal => {
        const linked = goalRecords(goal.id);
        const focuses = goal.focus_concepts.length ? goal.focus_concepts.slice(0, 2) : [goal.activity_type];
        focuses.forEach((focus, index) => {
          const repeated = recentThree.filter(record => record.dance_styles.includes(goal.dance_style) && record.focus_concepts.includes(focus)).length;
          candidates.push({
            id: `goal-${goal.id}-${index}`,
            title: `${goal.dance_style} · ${focus}`,
            activity_type: goal.activity_type,
            dance_style: goal.dance_style,
            focus_concepts: minutes <= 30 ? [focus] : [...new Set([focus, ...goal.focus_concepts])].slice(0, 3),
            related_goal_id: goal.id,
            source: "goal",
            linked_count: linked.length,
            weight: Math.max(1.2, 5.5 + (linked.length === 0 ? 1 : 0) - repeated * 0.85)
          });
        });
        candidates.push({
          id: `goal-${goal.id}-main`,
          title: `${goal.dance_style} ${goal.activity_type}`,
          activity_type: goal.activity_type,
          dance_style: goal.dance_style,
          focus_concepts: goal.focus_concepts.slice(0, minutes <= 30 ? 1 : 3),
          related_goal_id: goal.id,
          source: "goal",
          linked_count: linked.length,
          weight: minutes <= 30 && ["编舞", "拍摄", "发布作品"].includes(goal.activity_type) ? 2.2 : 4.2
        });
      });

      recent.forEach((record, index) => {
        const relatedGoal = goals.find(goal => goal.status === "active" && record.related_goal_ids.includes(goal.id));
        const style = record.dance_styles[0] || "Hiphop";
        const activity = record.activity_types[0] || "基本功";
        const focus = record.focus_concepts.slice(0, minutes <= 30 ? 1 : 2);
        candidates.push({
          id: `recent-${record.id}`,
          title: focus.length ? `${style} · ${focus[0]}` : `${style} ${activity}`,
          activity_type: activity,
          dance_style: style,
          focus_concepts: focus,
          related_goal_id: relatedGoal?.id || null,
          source: "recent",
          linked_count: 0,
          weight: Math.max(0.8, 2.8 - index * 0.25 - (index < 2 ? 0.45 : 0))
        });
      });

      if (!candidates.length) {
        candidates.push({
          id: "generic-foundation", title: "Hiphop 基本功", activity_type: "基本功", dance_style: "Hiphop",
          focus_concepts: ["groove"], related_goal_id: null, source: "generic", linked_count: 0, weight: 1
        });
      }
      return candidates;
    }

    function pickRecommendation() {
      const minutes = state.shuffleMinutes;
      let candidates = recommendationCandidates(minutes);
      if (candidates.length > 1 && state.lastRecommendationId) {
        const alternatives = candidates.filter(candidate => candidate.id !== state.lastRecommendationId);
        if (alternatives.length) candidates = alternatives;
      }
      const totalWeight = candidates.reduce((sum, candidate) => sum + candidate.weight, 0);
      let roll = Math.random() * totalWeight;
      let selected = candidates[0];
      for (const candidate of candidates) {
        roll -= candidate.weight;
        if (roll <= 0) {
          selected = candidate;
          break;
        }
      }

      const recent = [...records].sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at)).slice(0, 3);
      const dominantStyle = recent.length ? recent.map(record => record.dance_styles[0]).filter(Boolean).sort((a, b) => recent.filter(r => r.dance_styles[0] === b).length - recent.filter(r => r.dance_styles[0] === a).length)[0] : null;
      let reason = "今天没有必须完成的任务，选一个方向轻松开始就好。";
      if (selected.source === "goal") {
        if (selected.linked_count === 0) reason = "这个阶段还没正式开始，今天可以先起个头。";
        else if (dominantStyle && dominantStyle !== selected.dance_style) reason = `最近主要在练 ${dominantStyle}，今天可以换个方向推进当前阶段。`;
        else reason = "这个阶段正在进行，今天接着往前推一点。";
      } else if (selected.source === "recent") {
        reason = "从最近练过的内容接着走，进入状态会比较快。";
      }
      if (minutes <= 30 && selected.focus_concepts.length) reason = `${reason.replace(/。$/, "")}，时间刚好够专注一个局部。`;

      state.lastRecommendationId = selected.id;
      state.recommendation = { ...selected, duration_minutes: minutes, reason };
      return state.recommendation;
    }

    function openSheet(mode = "default") {
      overlay.classList.toggle("result-mode", mode === "result");
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      document.getElementById("sheet").scrollTop = 0;
    }

    function closeSheet() {
      overlay.classList.remove("open");
      overlay.classList.remove("result-mode");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function selectedValues(group) {
      return [...document.querySelectorAll(`[data-choice-group="${group}"].selected`)].map(button => button.dataset.choiceValue);
    }

    function splitValues(value) {
      return value.split(/[，,\n]/).map(item => item.trim()).filter(Boolean);
    }

    function saveRecord(form) {
      const selectedDuration = document.querySelector("[data-duration].selected");
      const customDuration = Number(form.elements.custom_duration.value);
      const duration = customDuration || Number(selectedDuration?.dataset.duration);
      let activities = selectedValues("activity");
      const customActivity = form.elements.custom_activity.value.trim();
      if (customActivity) activities = [...activities, customActivity];
      let styles = selectedValues("style");
      const customStyle = form.elements.custom_style.value.trim();
      if (customStyle) styles = [...styles, customStyle];
      if (!duration || duration < 1) {
        showToast("请填写练习时长");
        form.elements.custom_duration.focus();
        return;
      }
      if (!activities.length) {
        showToast("选一下今天做了什么");
        return;
      }
      if (!styles.length) {
        showToast("选一下舞种");
        return;
      }
      const now = new Date().toISOString();
      const existing = records.find(item => item.id === state.editingId);
      const value = {
        id: existing?.id || `r-${Date.now()}`,
        date: form.elements.date.value,
        duration_minutes: duration,
        activity_types: activities,
        dance_styles: styles,
        focus_concepts: splitValues(form.elements.focus_concepts.value),
        related_goal_ids: form.elements.related_goal.value ? [form.elements.related_goal.value] : [],
        note: form.elements.note.value.trim(),
        created_at: existing?.created_at || now
      };
      records = existing ? records.map(item => item.id === existing.id ? value : item) : [value, ...records];
      persistData();
      renderSummary();
      renderRecords();
      renderGoalsPage();
      closeSheet();
      showToast(existing ? "记录已更新" : "记录已保存");
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.addEventListener("click", event => {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        state.page = pageButton.dataset.page;
        renderPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      const shuffleDuration = event.target.closest("[data-shuffle-minutes]");
      if (shuffleDuration) {
        state.shuffleMinutes = Number(shuffleDuration.dataset.shuffleMinutes);
        document.querySelectorAll("[data-shuffle-minutes]").forEach(button => button.setAttribute("aria-pressed", String(button === shuffleDuration)));
        return;
      }
      if (event.target.closest("#drawRecommendation") || event.target.closest("[data-shuffle-again]")) {
        openRecommendation();
        return;
      }
      if (event.target.closest("[data-practice-recommendation]")) {
        practiceRecommendation();
        return;
      }
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        state.view = viewButton.dataset.view;
        renderRecords();
        return;
      }
      const dateScopeButton = event.target.closest("[data-date-scope]");
      if (dateScopeButton) {
        state.dateScope = dateScopeButton.dataset.dateScope;
        renderRecords();
        return;
      }
      const stageScopeButton = event.target.closest("[data-stage-scope]");
      if (stageScopeButton) {
        state.stageScope = stageScopeButton.dataset.stageScope;
        renderRecords();
        return;
      }
      if (event.target.closest("#addRecord")) {
        openEditor();
        return;
      }
      if (event.target.closest("#addGoal")) {
        openGoalForm();
        return;
      }
      const goalButton = event.target.closest("[data-goal-id]");
      if (goalButton) {
        openGoalDetail(goalButton.dataset.goalId);
        return;
      }
      const recordButton = event.target.closest("[data-record-id]");
      if (recordButton) {
        const record = records.find(item => item.id === recordButton.dataset.recordId);
        if (record) openDetail(record);
        return;
      }
      if (event.target.closest("[data-close]")) {
        closeSheet();
        return;
      }
      const editButton = event.target.closest("[data-edit-record]");
      if (editButton) {
        const record = records.find(item => item.id === editButton.dataset.editRecord);
        if (record) openEditor(record);
        return;
      }
      const editGoalButton = event.target.closest("[data-edit-goal]");
      if (editGoalButton) {
        const goal = goals.find(item => item.id === editGoalButton.dataset.editGoal);
        if (goal) openGoalForm(goal);
        return;
      }
      const statusButton = event.target.closest("[data-set-goal-status]");
      if (statusButton) {
        setGoalStatus(statusButton.dataset.setGoalStatus);
        return;
      }
      const choice = event.target.closest("[data-choice-group]");
      if (choice) {
        choice.classList.toggle("selected");
        choice.setAttribute("aria-pressed", String(choice.classList.contains("selected")));
        return;
      }
      const customToggle = event.target.closest("[data-custom-toggle]");
      if (customToggle) {
        const type = customToggle.dataset.customToggle;
        const wrap = document.getElementById(type === "activity" ? "customActivityWrap" : "customStyleWrap");
        const input = document.getElementById(type === "activity" ? "customActivity" : "customStyle");
        const opening = !wrap.classList.contains("open");
        wrap.classList.toggle("open", opening);
        customToggle.classList.toggle("selected", opening);
        customToggle.setAttribute("aria-pressed", String(opening));
        if (opening) input.focus();
        else input.value = "";
        return;
      }
      const duration = event.target.closest("[data-duration]");
      if (duration) {
        document.querySelectorAll("[data-duration]").forEach(button => {
          const selected = button === duration;
          button.classList.toggle("selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        document.getElementById("customDuration").value = "";
        return;
      }
      const suggestion = event.target.closest("[data-suggestion]");
      if (suggestion) {
        const input = document.getElementById("focusConcepts");
        const values = splitValues(input.value);
        if (!values.includes(suggestion.dataset.suggestion)) values.push(suggestion.dataset.suggestion);
        input.value = values.join("，");
      }
    });

    document.addEventListener("input", event => {
      if (event.target.id === "customDuration" && event.target.value) {
        document.querySelectorAll("[data-duration]").forEach(button => {
          button.classList.remove("selected");
          button.setAttribute("aria-pressed", "false");
        });
      }
    });

    document.addEventListener("change", event => {
      if (event.target.id !== "goalStyle") return;
      const wrap = document.getElementById("goalCustomStyleWrap");
      const input = document.getElementById("goalCustomStyle");
      const custom = event.target.value === "其他";
      wrap.classList.toggle("open", custom);
      if (custom) input.focus();
      else input.value = "";
    });

    document.addEventListener("submit", event => {
      if (event.target.id === "recordForm") {
        event.preventDefault();
        saveRecord(event.target);
      }
      if (event.target.id === "goalForm") {
        event.preventDefault();
        saveGoal(event.target);
      }
    });

    overlay.addEventListener("click", event => { if (event.target === overlay) closeSheet(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape" && overlay.classList.contains("open")) closeSheet(); });

    const now = new Date();
    document.getElementById("topDate").textContent = new Intl.DateTimeFormat("en-US", { month: "short", day: "2-digit", weekday: "short" }).format(now).toUpperCase();
    renderSummary();
    renderRecords();
    renderGoalsPage();
    renderPage();
  </script>
</body>
</html>
